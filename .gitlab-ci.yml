# GitLab CI/CD pipeline for the screening-service (Flask, Python 3.12).
# Docs: https://docs.gitlab.com/ee/ci/yaml/

stages:
  - test
  - build

# Default image for jobs that don't override it.
default:
  image: python:3.12-slim

# Cache pip downloads between runs to speed up installs.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

# ---- Stage: test ----------------------------------------------------------
# Installs dependencies and runs the pytest suite.
test:
  stage: test
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m pytest -q

# ---- Stage: build ---------------------------------------------------------
# Builds the Docker image and pushes it to the GitLab Container Registry.
# Runs only on the default branch, after tests pass.
build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
